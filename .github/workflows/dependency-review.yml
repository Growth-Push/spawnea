name: Dependency Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: dependency-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-24.04
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # Match the existing CI audit policy while blocking newly introduced high-severity issues.
          fail-on-severity: high
