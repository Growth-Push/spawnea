name: Bug report
description: Report a reproducible problem in Spawnea
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Spawnea. Remove secrets and sensitive host information from all logs and screenshots.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: commit SHA or release
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, local/remote host type, harness, tmux version, and other relevant details.
  - type: textarea
    id: logs
    attributes:
      label: Logs or additional context
      description: Remove credentials, tokens, private keys, and sensitive paths/hostnames before posting.
